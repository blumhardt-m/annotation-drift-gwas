# perturbation_matrix.yaml
# Protocol: L2G_INSTABILITY_AUDIT_PROTOCOL_v1.3
# Lock date: 2026-03-11
#
# Defines the baseline-shift perturbation design.
# Minimum 4 runs per trait: baseline + annotation_perturb + evidence_perturb + distance_perturb.
# All perturbation experiments must be applied identically across all traits.
#
# Baseline-shift order (locked, do not reorder):
#   1. baseline
#   2. + annotation perturbation
#   3. + evidence perturbation
#   4. + distance perturbation
#
# TODO_VERIFY: Resolve all TODO_VERIFY markers before first pipeline run.

# --- Annotation versions ---
annotation_versions:
  baseline:
    gencode_version: v38
    gtf_path: data/raw/gencode.v38.annotation.gtf.gz
    checksum_sha256: TODO_VERIFY
    status: TODO_VERIFY
  perturbed:
    gencode_version: v45
    gtf_path: data/raw/gencode.v45.annotation.gtf.gz
    checksum_sha256: TODO_VERIFY
    status: present  # file confirmed on disk; checksum pending

# --- Evidence-source configurations ---
# Listed in order from least to most complete (baseline-shift ordering).
evidence_configs:
  distance_only:
    id: distance_only
    sources:
      - genomic_distance
    notes: "Baseline evidence config. No molecular evidence."

  eqtl_only:
    id: eqtl_only
    sources:
      - genomic_distance
      - eqtl
    eqtl_dataset: TODO_VERIFY  # e.g. GTEx v8 whole blood or GTEx v10
    eqtl_path: data/raw/gtex_eqtl_TODO_VERIFY.tsv
    notes: "TODO_VERIFY — specify tissue and GTEx version"

  eqtl_plus_abc:
    id: eqtl_plus_abc
    sources:
      - genomic_distance
      - eqtl
      - chromatin_interaction_abc
    eqtl_dataset: TODO_VERIFY
    eqtl_path: data/raw/gtex_eqtl_TODO_VERIFY.tsv
    abc_dataset: TODO_VERIFY  # e.g. Fulco et al. 2019 or Nasser et al. 2021
    abc_path: data/raw/abc_scores_TODO_VERIFY.tsv
    notes: "TODO_VERIFY — specify ABC score source, version, and cell type scope"

  full_stack:
    id: full_stack
    sources:
      - genomic_distance
      - eqtl
      - chromatin_interaction_abc
      - regulatory_annotations
      - variant_effect_predictions
    eqtl_path: data/raw/gtex_eqtl_TODO_VERIFY.tsv
    abc_path: data/raw/abc_scores_TODO_VERIFY.tsv
    regulatory_path: data/raw/encode_regulatory_TODO_VERIFY/
    vep_path: data/raw/vep_scores_TODO_VERIFY.tsv
    notes: "Optional / sensitivity only. All paths TODO_VERIFY."
    optional: true

# --- Distance rules ---
distance_rules:
  nearest_gene:
    id: nearest_gene
    description: "Assign variant to the nearest protein-coding gene (by TSS distance)"
    window_kb: null
    notes: "Baseline distance rule."

  window_250kb:
    id: window_250kb
    description: "Consider all protein-coding genes within ±250 kb of lead variant"
    window_kb: 250

  window_500kb:
    id: window_500kb
    description: "Consider all protein-coding genes within ±500 kb of lead variant"
    window_kb: 500

# --- Locked perturbation runs (minimum set) ---
# Applies identically to all traits in traits_to_run.yaml.
runs:
  - run_id: run_01_baseline
    annotation: baseline         # GENCODE v38
    evidence: distance_only
    distance: nearest_gene
    role: baseline
    required: true

  - run_id: run_02_annotation_perturb
    annotation: perturbed        # GENCODE v45
    evidence: distance_only      # evidence held at baseline
    distance: nearest_gene       # distance held at baseline
    role: annotation_perturbation
    required: true

  - run_id: run_03_evidence_perturb
    annotation: baseline         # annotation held at baseline
    evidence: eqtl_only
    distance: nearest_gene       # distance held at baseline
    role: evidence_perturbation
    required: true

  - run_id: run_04_distance_perturb
    annotation: baseline         # annotation held at baseline
    evidence: distance_only      # evidence held at baseline
    distance: window_250kb
    role: distance_perturbation
    required: true

# Forbidden evidence sources in L2G assignment (from protocol, do not modify):
forbidden_in_l2g:
  - Reactome
  - MSigDB
  - STRING
