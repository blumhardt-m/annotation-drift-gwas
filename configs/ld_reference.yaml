# ld_reference.yaml
# Protocol: L2G_INSTABILITY_AUDIT_PROTOCOL_v1.3
# Lock date: 2026-03-11
#
# Configures the LD reference panel.
# The LD reference must remain CONSTANT across all perturbation runs (DEC-005).
# Do not change this file after the first pipeline run without issuing a new protocol version.
#
# TODO_VERIFY: Resolve all TODO_VERIFY markers before first pipeline run.

ld_reference:
  name: "1000 Genomes Phase 3 EUR"
  population: EUR
  phase: "Phase 3"
  genome_build: GRCh38
  ld_panel_path: data/raw/ld_reference/1kg_phase3_eur_TODO_VERIFY/
  plink_bfile_prefix: TODO_VERIFY  # e.g. data/raw/ld_reference/1kg_phase3_eur/1kg_eur_hg38
  version_tag: TODO_VERIFY  # Record exact version string or release date of the panel used
  checksum_sha256: TODO_VERIFY  # Checksum of the .bim file or manifest file
  n_samples: TODO_VERIFY  # Number of EUR samples in the reference panel (e.g. 503)
  source_url: TODO_VERIFY  # e.g. https://www.internationalgenome.org/data
  status: TODO_VERIFY
  notes: >
    The LD reference panel must be locked to this exact version before the first pipeline run.
    It must not change between runs or between traits. Record confirmation in DECISIONS.md
    once the path is verified. See DEC-005.

# Lock enforcement reminder:
# Any deviation from the above LD reference across ANY run must be recorded in RUN_LOG.md
# under "protocol deviations" and in DECISIONS.md. Such a deviation may invalidate
# cross-run comparisons and require reanalysis.
lock_enforcement:
  constant_across_runs: true
  constant_across_traits: true
  deviation_handling: "record in RUN_LOG.md protocol_deviations field and in DECISIONS.md"
