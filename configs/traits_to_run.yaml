# Replication rule (from protocol, do not modify):
# instability pattern must replicate in at least 2 of 3 traits
# replication requires: instability_heterogeneity AND material_downstream_impact
# failure in fewer than 2 traits triggers project termination
replication_rule:
  min_traits_required: 2
  conditions_required:
    - instability_heterogeneity  # mean(Q4) >= 3 * mean(Q1)
    - material_downstream_impact  # top-10% loci account for >=30% Jaccard degradation AND Jaccard < 0.65
