#
# Configures pathway databases for downstream impact evaluation.
# Primary arbiter is Reactome (locked).
# Sensitivity database is MSigDB C2 (locked).
# Reactome, MSigDB, and STRING are forbidden from influencing L2G assignment.
#
# TODO_VERIFY: Resolve all TODO_VERIFY markers before first pipeline run.

primary:
  name: Reactome
  gmt_path: data/raw/ReactomePathways.gmt
  version: TODO_VERIFY  # Extract from GMT file header or download page and record here
  species: Homo sapiens
  download_url: TODO_VERIFY  # e.g. https://reactome.org/download/current/ReactomePathways.gmt.zip
  checksum_sha256: TODO_VERIFY
  status: present  # file confirmed on disk; version and checksum pending
  notes: "Primary pathway arbiter per DEC-004. All instability-to-pathway analyses use Reactome unless noted as sensitivity."

sensitivity:
  name: MSigDB C2
  gmt_path: data/raw/msigdb_c2_TODO_VERIFY.gmt
  version: TODO_VERIFY  # e.g. v2023.2 or v2024.1
  species: Homo sapiens
  download_url: TODO_VERIFY  # MSigDB portal; requires registration
  checksum_sha256: TODO_VERIFY
  status: TODO_VERIFY
  notes: "Sensitivity only. Must use same version across all sensitivity runs. Not used in primary analysis."

# Instability impact thresholds (locked, do not modify):
material_impact_thresholds:
  primary:
    description: "Top 10% of unstable loci account for >=30% of pathway Jaccard degradation"
    top_pct_unstable_loci: 0.10
    min_jaccard_degradation_share: 0.30
  secondary:
    description: "Jaccard similarity < 0.65 between pathway result sets"
    jaccard_threshold: 0.65

# Circularity constraint (locked, do not modify):
# The following databases must NOT be used as evidence sources in L2G assignment.
forbidden_in_l2g_assignment:
  - Reactome
  - MSigDB
  - STRING
